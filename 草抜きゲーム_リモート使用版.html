<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>草抜き放題 リモート使用版</title>
<style>
  :root {
    --sky-top: #bfe8ff;
    --sky-bottom: #eaffea;
    --dirt: #8a5a34;
    --dirt-dark: #6e4526;
    --grass-dark: #2e7d32;
    --grass-mid: #43a047;
    --grass-light: #66bb6a;
    --panel-bg: rgba(255, 255, 255, 0.88);
    --accent: #ff7043;
    --text: #2f3b2f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%);
    color: var(--text);
    overflow-x: hidden;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 12px 40px;
  }
  header {
    width: 100%;
    max-width: 720px;
    text-align: center;
    margin-bottom: 8px;
  }
  h1 {
    font-size: clamp(20px, 5vw, 30px);
    margin: 6px 0 2px;
    color: var(--grass-dark);
    text-shadow: 1px 1px 0 #fff;
  }
  .subtitle {
    font-size: 13px;
    color: #567;
    margin-bottom: 4px;
  }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 999px;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .hud {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 10px 0;
    background: var(--panel-bg);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  .stat {
    text-align: center;
    min-width: 78px;
    padding: 4px 8px;
  }
  .stat .label { font-size: 11px; color: #789; }
  .stat .value { font-size: 20px; font-weight: 700; color: var(--grass-dark); }

  #field {
    position: relative;
    width: 100%;
    max-width: 720px;
    aspect-ratio: 4 / 3;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.35), transparent 60%),
      linear-gradient(180deg, var(--dirt) 0%, var(--dirt-dark) 100%);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18), inset 0 0 0 4px rgba(255,255,255,0.4);
    touch-action: manipulation;
  }
  .tuft {
    position: absolute;
    width: 11%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .tuft svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .tuft.growing { pointer-events: none; }
  .tuft .blade {
    transform-origin: 50% 100%;
    transition: transform 0.08s ease-out;
  }
  .tuft.pulled .blade {
    animation: pullOut 0.35s ease-in forwards;
  }
  @keyframes pullOut {
    0%   { transform: translateY(0) rotate(var(--r, 0deg)) scale(1); opacity: 1; }
    60%  { transform: translateY(-30px) rotate(calc(var(--r, 0deg) + 25deg)) scale(1.1); opacity: 1; }
    100% { transform: translateY(-70px) rotate(calc(var(--r, 0deg) + 45deg)) scale(0.6); opacity: 0; }
  }
  .tuft.sprouting .blade {
    animation: sprout 0.5s ease-out forwards;
  }
  @keyframes sprout {
    0%   { transform: scaleY(0); opacity: 0; }
    100% { transform: scaleY(1); opacity: 1; }
  }
  .float-score {
    position: absolute;
    font-weight: 800;
    font-size: 15px;
    color: var(--accent);
    pointer-events: none;
    text-shadow: 1px 1px 0 #fff;
    animation: floatUp 0.7s ease-out forwards;
    transform: translate(-50%, -50%);
    z-index: 5;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
    100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); }
  }

  .controls {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: var(--grass-mid);
    color: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    transition: transform 0.1s ease, background 0.2s;
  }
  button:active { transform: scale(0.95); }
  button.secondary {
    background: #fff;
    color: var(--grass-dark);
    border: 2px solid var(--grass-mid);
  }
  footer {
    margin-top: 18px;
    font-size: 11px;
    color: #8a9;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="badge">REMOTE EDITION</span>
    <h1>🌿 草抜き放題 リモート使用版 🌿</h1>
    <div class="subtitle">タップ or クリックで無限に草を抜こう。抜いてもすぐ生えてくる！</div>
  </header>

  <div class="hud">
    <div class="stat">
      <div class="label">抜いた本数</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="label">自己ベスト</div>
      <div class="value" id="best">0</div>
    </div>
    <div class="stat">
      <div class="label">コンボ</div>
      <div class="value" id="combo">0</div>
    </div>
    <div class="stat">
      <div class="label">毎秒</div>
      <div class="value" id="rate">0</div>
    </div>
  </div>

  <div id="field"></div>

  <div class="controls">
    <button id="resetBtn" class="secondary">記録をリセット</button>
  </div>

  <footer>何度でも、いくらでも草を抜けます。飽きるまでどうぞ。</footer>
</div>

<script>
(function () {
  const field = document.getElementById('field');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboEl = document.getElementById('combo');
  const rateEl = document.getElementById('rate');
  const resetBtn = document.getElementById('resetBtn');

  const STORAGE_KEY = 'grass-pull-remote-best';
  const TUFT_COUNT = 14;

  let score = 0;
  let best = Number(localStorage.getItem(STORAGE_KEY) || 0);
  let combo = 0;
  let comboTimer = null;
  let recentPulls = [];

  bestEl.textContent = best;

  function grassSVG(seed) {
    const rnd = mulberry32(seed);
    const bladeCount = 5 + Math.floor(rnd() * 3);
    let blades = '';
    for (let i = 0; i < bladeCount; i++) {
      const angle = (rnd() - 0.5) * 50;
      const height = 55 + rnd() * 35;
      const hueShift = Math.floor(rnd() * 3);
      const colors = ['var(--grass-dark)', 'var(--grass-mid)', 'var(--grass-light)'];
      const x = 50 + (rnd() - 0.5) * 20;
      blades += `<path class="blade" style="--r:${angle}deg" d="M ${x} 100 Q ${x + angle * 0.5} ${100 - height * 0.6} ${x + angle} ${100 - height}"
        stroke="${colors[hueShift]}" stroke-width="9" fill="none" stroke-linecap="round"
        transform="rotate(${angle} ${x} 100)"/>`;
    }
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">${blades}</svg>`;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const tufts = [];

  function layoutPosition(i) {
    // Scatter positions with a bit of jitter, avoiding exact grid feel.
    const cols = 5;
    const row = Math.floor(i / cols);
    const col = i % cols;
    const jitterX = (Math.random() - 0.5) * 8;
    const jitterY = (Math.random() - 0.5) * 8;
    const x = (col + 0.5) / cols * 100 + jitterX;
    const y = 22 + row * 24 + jitterY;
    return { x: Math.min(95, Math.max(5, x)), y: Math.min(92, Math.max(15, y)) };
  }

  function createTuft(i) {
    const el = document.createElement('div');
    el.className = 'tuft';
    const pos = layoutPosition(i);
    el.style.left = pos.x + '%';
    el.style.top = pos.y + '%';
    el.dataset.seed = Math.floor(Math.random() * 100000);
    el.innerHTML = grassSVG(Number(el.dataset.seed));
    el.addEventListener('pointerdown', () => pull(el));
    field.appendChild(el);
    tufts.push(el);
  }

  for (let i = 0; i < TUFT_COUNT; i++) createTuft(i);

  function spawnFloatScore(x, y, text) {
    const f = document.createElement('div');
    f.className = 'float-score';
    f.textContent = text;
    f.style.left = x + '%';
    f.style.top = y + '%';
    field.appendChild(f);
    setTimeout(() => f.remove(), 700);
  }

  function regrow(el) {
    el.dataset.seed = Math.floor(Math.random() * 100000);
    el.innerHTML = grassSVG(Number(el.dataset.seed));
    el.classList.remove('pulled');
    el.classList.add('sprouting');
    setTimeout(() => {
      el.classList.remove('sprouting', 'growing');
    }, 500);
  }

  function pull(el) {
    if (el.classList.contains('pulled') || el.classList.contains('growing')) return;

    el.classList.add('pulled', 'growing');

    // Combo handling
    combo += 1;
    recentPulls.push(Date.now());
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { combo = 0; comboEl.textContent = combo; }, 1200);
    comboEl.textContent = combo;

    const gained = 1 + Math.floor(combo / 10);
    score += gained;
    scoreEl.textContent = score;

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(STORAGE_KEY, String(best));
    }

    const rect = el.getBoundingClientRect();
    const fieldRect = field.getBoundingClientRect();
    const x = ((rect.left + rect.width / 2 - fieldRect.left) / fieldRect.width) * 100;
    const y = ((rect.top - fieldRect.top) / fieldRect.height) * 100;
    spawnFloatScore(x, y, gained > 1 ? `+${gained} combo!` : '+1');

    const delay = 250 + Math.random() * 500;
    setTimeout(() => regrow(el), delay);
  }

  // Rolling pull-rate (per second) display
  setInterval(() => {
    const now = Date.now();
    recentPulls = recentPulls.filter(t => now - t < 5000);
    rateEl.textContent = (recentPulls.length / 5).toFixed(1);
  }, 500);

  resetBtn.addEventListener('click', () => {
    if (!confirm('自己ベストの記録をリセットしますか？')) return;
    best = 0;
    localStorage.setItem(STORAGE_KEY, '0');
    bestEl.textContent = 0;
  });
})();
</script>
</body>
</html>
