<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロボットみちあんない</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef7f4; --card:#ffffff; --ink:#22313a; --sub:#5d6f78; --line:#cfe3dc;
  --main:#1f9d8a; --main-d:#0f7566;
  --left:#2f6fdb; --right:#e8730c; --ok:#2b8a3e; --ng:#c92a2a; --cell:#f7fcfa; --cell2:#e6f4ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:1.5rem;margin:4px 0 2px;display:flex;align-items:center;gap:10px}
h1 img{height:60px;width:60px;border-radius:14px;flex:none}
.resrow{display:flex;gap:12px;align-items:center}
.resrow img{flex:none;height:auto;border-radius:12px;background:#fff}
.resrow .txt{min-width:0;flex:1}
@media(max-width:480px){.resrow{flex-direction:column;text-align:left}}
.hop{animation:hop .3s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-7px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
#confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50}
#confetti i{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
.lead{color:var(--sub);margin:0 0 12px;font-size:.9rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:2px solid var(--main);background:var(--card);color:var(--main-d);border-radius:12px;padding:8px 14px;min-height:44px}
button:hover{background:var(--cell2)}
button:focus-visible{outline:3px solid var(--left);outline-offset:2px}
button.primary{background:var(--main);color:#fff;font-weight:bold;font-size:1.1rem;padding:10px 26px}
button.primary:hover{background:var(--main-d)}
button.on{background:var(--main);color:#fff}
button:disabled{opacity:.45;cursor:default}
.story{font-size:1.15rem;line-height:2}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
svg{touch-action:manipulation;max-width:100%;height:auto;user-select:none;-webkit-user-select:none}
#map{width:100%;max-width:420px;display:block;margin:0 auto}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmds button{font-weight:bold;font-size:1rem;line-height:1.3}
.cmds .f{border-color:var(--main)}
.cmds .l{border-color:var(--left);color:var(--left)}
.cmds .r{border-color:var(--right);color:var(--right)}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;margin:10px 0;padding:8px;border:2px dashed var(--line);border-radius:12px;background:var(--cell)}
.chip{min-height:40px;padding:4px 10px;border-radius:10px;font-weight:bold;font-size:.95rem}
.chip.f{background:var(--main);color:#fff;border-color:var(--main)}
.chip.l{background:var(--left);color:#fff;border-color:var(--left)}
.chip.r{background:var(--right);color:#fff;border-color:var(--right)}
.chip.run{outline:4px solid #ffd43b}
.chip.ghost{opacity:.7;pointer-events:none}
.cnt{font-weight:bold}
.cnt.over{color:var(--ng)}
.hint{background:#f1f8ff;border-left:6px solid var(--left);padding:8px 12px;border-radius:8px;margin-top:8px}
.hint ul{margin:4px 0;padding-left:1.3em}
.result{border-radius:14px;padding:12px 16px;margin-top:10px}
.result.ok{background:#e6f7e9;border:2px solid var(--ok)}
.result.ng{background:#fdecec;border:2px solid var(--ng)}
.result li{margin:2px 0}
.small{font-size:.85rem;color:var(--sub)}
.hidden{display:none!important}
table{border-collapse:collapse;font-size:.9rem}
td,th{border:1px solid var(--line);padding:3px 10px;text-align:center}
.legend{font-size:.85rem;color:var(--sub);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.hop{animation:none}#confetti{display:none}}
</style>
</head>

  <p class="lead">めいれいカードをならべて、ロボットをゴールまで道あんないしよう。「右」「左」はロボットから見た向きだよ。</p>

  <div class="card">
    <div class="row" id="levels">
      <button data-lv="1">レベル1<br><span class="small">ゴールまで</span></button>

    <div class="row">

      <span class="small" id="timer" style="margin-left:auto"></span>
    </div>
    <div class="story" id="story"></div>
  </div>

    <div class="card">
      <svg id="map" viewBox="0 0 300 300" aria-label="ロボットの地図"></svg>
      <div class="legend">🚩スタート　ゴール（おうち）　いわ（ぶつかるよ）</div>
    </div>
    <div class="card">
      <strong>🃏 めいれいカード</strong>
      <div class="cmds" id="cmds">
        <button class="f" data-c="F1">⬆ 1マス<br>すすむ</button>
        <button class="f" data-c="F2">⬆ 2マス<br>すすむ</button>
        <button class="f" data-c="F3">⬆ 3マス<br>すすむ</button>
        <button class="l" data-c="L">↰ 左に<br>まがる</button>
        <button class="r" data-c="R">↱ 右に<br>まがる</button>
        <button id="undo">⌫ 1つ消す</button>
      </div>
      <div class="row" style="margin-top:8px"><strong>ならべたカード</strong><span class="cnt" id="cnt"></span></div>
      <div class="prog" id="prog" aria-live="polite"></div>
      <div class="small">カードをタップすると、そのカードだけ消えるよ。</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button class="primary" id="go">▶ ロボットをうごかす</button>
      <button id="reset">↺ もとにもどす</button>
      <button id="clearProg">🗑 カードを全部消す</button>
      <button id="hintBtn">💡 ヒント（0/3）</button>
      <button id="next" class="hidden">▶ つぎのもんだい</button>
    </div>
    <div id="hintArea"></div>
    <div id="result"></div>
  </div>

  <div class="card">
    <div class="row">
      <strong>📊 きろく</strong>
      <button id="csv" style="margin-left:auto">📥 CSVで出力</button>
      <button id="clear">きろくを消す</button>
    </div>
    <div id="stats" class="small"></div>
  </div>
</div>

<script>
(() => {
  const LOG_KEY = "robot_michiannai_log";
  const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const pick = a => a[R(0,a.length-1)];
  const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
  const $ = id => document.getElementById(id);
  const DX=[0,1,0,-1], DY=[-1,0,1,0], DNAME=["上","右","下","左"];

  // ---------- 問題生成（解ける道を先に作る） ----------
  function genProblem(level){
    const N = level===1 ? 5 : 6, segs = level===1 ? 3 : level===2 ? 4 : 5;
    for(let attempt=0; attempt<500; attempt++){
      let x=R(0,N-1), y=R(0,N-1), d=R(0,3);
      const start={x,y,d}, used=new Set([x+","+y]), sol=[], ends=[];
      let ok=true;
      for(let s=0;s<segs && ok;s++){
        if(s>0 || Math.random()<.6){ const t = pick(["L","R"]); sol.push(t); d=(d+(t==="R"?1:3))%4; }
        const maxLen=R(1,4); let len=0;
        while(len<maxLen){
          const nx=x+DX[d], ny=y+DY[d];
          if(nx<0||ny<0||nx>=N||ny>=N||used.has(nx+","+ny)) break;
          x=nx;y=ny;used.add(x+","+y);len++;
        }
        if(len===0){ ok=false; break; }
        for(let r=len;r>0;){ const k=Math.min(3,r); sol.push("F"+k); r-=k; }
        ends.push({x,y});
      }
      if(!ok) continue;
      const goal={x,y};
      const itemCells = level===1 ? [] : ends.slice(0,-1).slice(-(level===2?2:3));
      if(level>1 && itemCells.length < (level===2?2:3)) continue;
      const emo = shuffle(ITEMS).slice(0,itemCells.length);
      const items = itemCells.map((c,i)=>({x:c.x,y:c.y,e:emo[i]}));
      const rocks=[], free=[];
      for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++) if(!used.has(xx+","+yy)) free.push({x:xx,y:yy});
      shuffle(free).slice(0, level===1?2:level===2?4:6).forEach(c=>rocks.push(c));
      return { level, N, start, goal, items, rocks, sol, limit: level===3 ? sol.length+2 : 0 };
    }
    return genProblem(level);
  }

  // ---------- シミュレーション ----------
  function simulate(prog, p){
    let {x,y,d}=p.start; const trace=[{x,y,d,i:-1}], got=[]; let crash=null;
    const rockAt=(a,b)=>p.rocks.some(r=>r.x===a&&r.y===b);
    for(let i=0;i<prog.length && !crash;i++){
      const c=prog[i];
      if(c==="L"||c==="R"){ d=(d+(c==="R"?1:3))%4; trace.push({x,y,d,i}); continue; }
      for(let k=0;k<+c[1];k++){
        const nx=x+DX[d], ny=y+DY[d];
        if(nx<0||ny<0||nx>=p.N||ny>=p.N){ crash={i,kind:"かべ",x:nx,y:ny}; trace.push({x,y,d,i,bump:{x:nx,y:ny}}); break; }
        if(rockAt(nx,ny)){ crash={i,kind:"いわ",x:nx,y:ny}; trace.push({x,y,d,i,bump:{x:nx,y:ny}}); break; }
        x=nx;y=ny; trace.push({x,y,d,i});
        const it=p.items.findIndex(t=>t.x===x&&t.y===y);
        if(it>=0 && !got.includes(it)) got.push(it);
      }
    }
    return { trace, crash, end:{x,y,d}, got };
  }
  function evaluate(prog, p){
    const r=simulate(prog,p), errs=[], msgs=[];
    if(!prog.length){ errs.push("empty"); msgs.push("めいれいカードがまだありません。"); return {r,errs,msgs}; }
    if(r.crash){ errs.push("crash"); msgs.push(`${r.crash.i+1}まい目のカードで<b>${r.crash.kind}にぶつかりました</b>。`); }
    else {
      const need=p.items.length;
      const missing=p.items.map((t,i)=>i).filter(i=>!r.got.includes(i));
      if(missing.length){ errs.push("missing"); msgs.push(`${missing.map(i=>p.items[i].e).join("")}を<b>とりわすれ</b>ています。`); }
      else if(r.got.some((v,i)=>v!==i)){ errs.push("order"); msgs.push(`集める<b>じゅんばんがちがいます</b>（${p.items.map(t=>t.e).join("→")}の順）。`); }
      if(r.end.x!==p.goal.x || r.end.y!==p.goal.y){
        errs.push("not_goal");
        const dx=p.goal.x-r.end.x, dy=p.goal.y-r.end.y, parts=[];
        if(dx) parts.push(`${dx>0?"右":"左"}に${Math.abs(dx)}マス`);
        if(dy) parts.push(`${dy>0?"下":"上"}に${Math.abs(dy)}マス`);
        msgs.push(`ロボットはゴールに<b>着いていません</b>。ゴールは、とまった場所から地図で${parts.join("、")}のところです。`);
      }
    }
    if(p.limit && prog.length>p.limit){ errs.push("over_limit"); msgs.push(`カードは<b>${p.limit}まいまで</b>です（いまは${prog.length}まい）。`); }
    if(errs.length && !errs.includes("empty")){
      const sw=prog.map(c=>c==="L"?"R":c==="R"?"L":c), r2=simulate(sw,p);
      if(!r2.crash && r2.end.x===p.goal.x && r2.end.y===p.goal.y && p.items.every((_,i)=>r2.got[i]===i) && sw.some((c,i)=>c!==prog[i])){
        errs.push("lr_swap"); msgs.push("もしかして<b>右と左がぎゃくになっている</b>かも。ロボットの目線（ロボットが向いている方向）で、右と左をもう一度たしかめよう。");
      }
    }
    return {r,errs,msgs};
  }

  // ---------- 効果音・演出 ----------
  const SND_KEY="robot_michiannai_sound";
  let soundOn=true; try{ soundOn=localStorage.getItem(SND_KEY)!=="0"; }catch(e){}
  const sfx=(()=>{
    let ac=null;
    const ctx=()=>{ try{ if(!ac){ const C=window.AudioContext||window.webkitAudioContext; if(C) ac=new C(); } if(ac&&ac.state==="suspended") ac.resume(); }catch(e){ ac=null; } return ac; };
    const tone=(f,t0,dur,vol,type)=>{
      const a=ctx(); if(!a) return;
      const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+t0;
      o.type=type||"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
    };
    return {
      unlock(){ if(soundOn) ctx(); },
      step(){ if(soundOn) tone(520+Math.random()*40,0,.11,.05,"sine"); },
      win(){ if(soundOn) [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.12,i===3?.35:.16,.06,"triangle")); }
    };
  })();

  // ---------- 地図描画 ----------
  const NS="http://www.w3.org/2000/svg", svg=$("map");
  function mk(tag,attrs,parent,text){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||svg).appendChild(e); if(text!=null) e.textContent=text; return e; }
  function drawMap(robot, previewTrace, hop){
    const p=S.prob, N=p.N, u=300/N; svg.innerHTML="";
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)
      mk("rect",{x:x*u,y:y*u,width:u,height:u,fill:(x+y)%2?"#f7fcfa":"#e6f4ef",stroke:"#cfe3dc"});
    const cx=c=>c.x*u+u/2, cy=c=>c.y*u+u/2, fs=u*.55;
    mk("rect",{x:p.goal.x*u+2,y:p.goal.y*u+2,width:u-4,height:u-4,fill:"#fff3bf",stroke:"#f59f00","stroke-width":3,rx:8});
    mk("image",{href:IMG.house,x:p.goal.x*u+u*.08,y:p.goal.y*u+u*.08,width:u*.84,height:u*.84});
    p.rocks.forEach(r=>mk("image",{href:IMG.rock,x:r.x*u+u*.06,y:r.y*u+u*.06,width:u*.88,height:u*.88}));
    p.items.forEach((t,i)=>{
      const got = S.collected && S.collected.includes(i);
      mk("text",{x:cx(t),y:cy(t)+fs*.35,"text-anchor":"middle","font-size":fs,opacity:got?.25:1},null,t.e);
      mk("text",{x:t.x*u+u*.85,y:t.y*u+u*.25,"text-anchor":"middle","font-size":u*.24,"font-weight":"bold",fill:"#22313a"},null,i+1);
    });
    if(previewTrace && previewTrace.length>1)
      mk("polyline",{points:previewTrace.map(t=>cx(t)+","+cy(t)).join(" "),fill:"none",stroke:"#1f9d8a","stroke-width":5,"stroke-dasharray":"2 9","stroke-linecap":"round",opacity:.8});
    const rs=u*.92;
    const pos=mk("g",{transform:`translate(${cx(robot)},${cy(robot)})`});
    const hg=mk("g",hop?{class:"hop"}:{},pos);
    const g=mk("g",{transform:`rotate(${robot.d*90})`},hg);
    mk("image",{href:IMG.token,x:-rs/2,y:-rs/2,width:rs,height:rs},g);
    // スタート印（ロボットの上に小さく）
    const sx=p.start.x*u, sy=p.start.y*u;
    mk("text",{x:sx+u*.04,y:sy+u*.26,"font-size":u*.26},null,"🚩");
    mk("text",{x:sx+u*.5,y:sy+u*.97,"text-anchor":"middle","font-size":u*.17,"font-weight":"bold",fill:"#0f7566",stroke:"#fff","stroke-width":u*.06,"paint-order":"stroke"},null,"スタート");
  }
  function showStart(){
    S.collected=[];
    let prev=null;
    if(S.slow && S.prog.length) prev=simulate(S.prog,S.prob).trace;
    drawMap(S.prob.start, prev);
  }

  // ---------- 画面 ----------
  function storyText(p){
    const base=`ロボットは🚩スタートで<b>${DNAME[p.start.d]}</b>をむいています。`;
    if(p.level===1) return `${base}めいれいカードをならべて、いわにぶつからないようにゴールのおうちまで行かせましょう。`;
    if(p.level===2) return `${base}${p.items.map(t=>t.e).join("→")}の<b>じゅんばん</b>にとってから、ゴールのおうちへ行かせましょう。いわにぶつからないように。`;
    return `${base}${p.items.map(t=>t.e).join("→")}の<b>じゅんばん</b>にとってから、ゴールのおうちへ。カードは<b>${p.limit}まい</b>までです。`;
  }
  function newProblem(){
    S.prob=genProblem(S.level); S.prog=[]; S.hints=0; S.tries=0; S.done=false; S.busy=false; S.start=Date.now(); S.qCount++;
    $("qno").textContent=`もんだい ${S.qCount}`;
    $("story").innerHTML=storyText(S.prob);
    $("go").disabled=false; $("hintBtn").disabled=false;
    $("next").classList.add("hidden"); $("hintArea").innerHTML=""; $("result").innerHTML="";
    $("hintBtn").textContent="💡 ヒント（0/3）";
    renderProg(); showStart();
  }
  function renderProg(){
    const box=$("prog"); box.innerHTML="";
    S.prog.forEach((c,i)=>{
      const b=document.createElement("button"); b.className="chip "+(c[0]==="F"?"f":c==="L"?"l":"r"); b.textContent=label(c);
      b.setAttribute("aria-label",`${i+1}まい目 ${word(c)}。タップで消す`);
      b.onclick=()=>{ if(S.done||S.busy) return; S.prog.splice(i,1); renderProg(); showStart(); };
      box.appendChild(b);
    });
    const p=S.prob, lim=p&&p.limit;
    $("cnt").className="cnt"+(lim&&S.prog.length>lim?" over":"");
    $("cnt").textContent=`${S.prog.length}まい`+(lim?` / ${lim}まいまで`:"");
  }
  document.querySelectorAll("#cmds button[data-c]").forEach(b=>b.onclick=()=>{
    if(S.done||S.busy) return; S.prog.push(b.dataset.c); renderProg(); showStart();
  });
  $("undo").onclick=()=>{ if(S.done||S.busy) return; S.prog.pop(); renderProg(); showStart(); };
  $("clearProg").onclick=()=>{ if(S.done||S.busy) return; S.prog=[]; renderProg(); showStart(); };
  $("reset").onclick=()=>{ if(S.busy) return; showStart(); $("result").innerHTML=""; };

  // ---------- ヒント ----------
  function showHints(){
    const p=S.prob, out=[];
    if(S.hints>=1){
      const dx=p.goal.x-p.start.x, dy=p.goal.y-p.start.y, parts=[];
      if(dx) parts.push(`${dx>0?"右":"左"}に${Math.abs(dx)}マス`); if(dy) parts.push(`${dy>0?"下":"上"}に${Math.abs(dy)}マス`);
      const li=[`ロボットは<b>${DNAME[p.start.d]}</b>をむいています。`,`ゴールは、スタートから地図で${parts.join("、")||"同じ場所"}です。`];
      if(p.items.length) li.push(`とる順番：${p.items.map(t=>t.e).join("→")}`);
      if(p.limit) li.push(`カードは${p.limit}まいまで。`);
      out.push(`<b>① 読み取ったこと</b><ul><li>${li.join("</li><li>")}</li></ul>`);
    }
    if(S.hints>=2){
      out.push(`<b>② 考え方</b><ul><li>ロボットが向いている方向が「前」です。右と左も、ロボットから見て決めます。</li><li>まがるとロボットの向きがかわります。1回まがったら、地図の矢じるし（黄色い三角）を見てたしかめよう。</li><li>自分の体をロボットと同じ向きにして、右手・左手でたしかめてもOK。</li></ul>`);
    }
    if(S.hints>=3){
      const n=Math.ceil(p.sol.length/2);
      out.push(`<b>③ 最初の半分</b><ul><li>${p.sol.slice(0,n).map(word).join(" → ")}</li><li>のこりは自分で考えよう。</li></ul>`);
    }
    $("hintArea").innerHTML=out.length?`<div class="hint">${out.join("<hr>")}</div>`:"";
    $("hintBtn").textContent=`💡 ヒント（${S.hints}/3）`; $("hintBtn").disabled=S.hints>=3;
  }
  $("hintBtn").onclick=()=>{ if(S.hints<3&&!S.done){ S.hints++; showHints(); } };

  // ---------- 実行 ----------
  function record(correct, errs){
    const row={at:new Date().toISOString(),level:S.prob.level,slow:S.slow?1:0,correct:correct?1:0,errors:errs.join("|"),
      hints:S.hints,sec:Math.round((Date.now()-S.start)/1000),tries:S.tries,cards:S.prog.length};
    try{ const a=JSON.parse(localStorage.getItem(LOG_KEY)||"[]"); a.push(row); localStorage.setItem(LOG_KEY,JSON.stringify(a)); }catch(e){}
    renderStats();
  }
  $("go").onclick=()=>{
    if(S.done||S.busy) return;
    const p=S.prob, ev=evaluate(S.prog,p);
    S.tries++; S.busy=true; $("result").innerHTML="";
    S.collected=[];
    const chips=[...$("prog").children], ms=S.slow?800:380;
    let k=0, prev=p.start;
    sfx.unlock();
    const step=()=>{
      if(k>=ev.r.trace.length){ finish(); return; }
      const t=ev.r.trace[k++];
      chips.forEach((c,i)=>c.classList.toggle("run",i===t.i));
      S.prob.items.forEach((it,i)=>{ if(it.x===t.x&&it.y===t.y&&!S.collected.includes(i)&&ev.r.got.includes(i)) S.collected.push(i); });
      const moved=t.x!==prev.x||t.y!==prev.y; prev=t;
      drawMap(t,null,moved);
      if(moved) sfx.step();
      setTimeout(step,ms);
    };
    const finish=()=>{
      chips.forEach(c=>c.classList.remove("run")); S.busy=false;
      const box=$("result");
      if(!ev.errs.length){
        S.done=true; $("go").disabled=true; $("hintBtn").disabled=true; $("next").classList.remove("hidden");
        box.innerHTML=`<div class="result ok"><div class="resrow"><img src="${IMG.joy}" width="160" alt=""><div class="txt"><b>🎉 だいせいかい！</b><ul><li>${S.prog.length}まいのカードで、ゴールに着きました。</li>${p.items.length?`<li>${p.items.map(t=>t.e).join("→")}の順に集められました。</li>`:""}</ul><span class="small">ヒント ${S.hints}回 ／ ${S.tries}回目で成功</span></div></div></div>`;
        sfx.win(); confetti();
        record(true,[]);
      } else {
        box.innerHTML=`<div class="result ng"><div class="resrow"><img src="${IMG.think}" width="140" alt=""><div class="txt"><b>😢 おしい！ もう一度かんがえよう</b><ul><li>${ev.msgs.join("</li><li>")}</li></ul><span class="small">「もとにもどす」で地図をスタートにもどせるよ。</span></div></div></div>`;
        record(false,ev.errs);
      }
    };
    step();
  };
  $("next").onclick=newProblem;

  // ---------- 付属機能 ----------
  $("speak").onclick=()=>{
    if(!("speechSynthesis" in window)) return alert("このブラウザは読み上げに対応していません。");
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance($("story").textContent); u.lang="ja-JP"; u.rate=S.slow?.8:1; speechSynthesis.speak(u);
  };
  setInterval(()=>{ $("timer").textContent=(S.slow||S.done)?"":`⏱ ${Math.round((Date.now()-S.start)/1000)}秒`; },1000);
  function setLevel(lv){
    S.level=lv; S.qCount=0;
    document.querySelectorAll("#levels button").forEach(b=>b.classList.toggle("on",+b.dataset.lv===lv));
    newProblem();
  }
  document.querySelectorAll("#levels button").forEach(b=>b.onclick=()=>{ if(!S.busy) setLevel(+b.dataset.lv); });
  function modeNote(){
    $("modeNote").textContent=S.slow
      ? "ゆっくりモード：時間表示なし・カードを置くたびに進む道を点線で表示・ロボットがゆっくり動く・読み上げがゆっくり"
      : "ふつうモード：経過時間を表示・道すじは実行して確かめる";
  }
  $("slow").onchange=e=>{ S.slow=e.target.checked; modeNote(); $("timer").textContent=""; if(!S.busy) showStart(); };

  // ---------- きろく ----------
  const getLog=()=>{ try{ return JSON.parse(localStorage.getItem(LOG_KEY)||"[]"); }catch(e){ return []; } };
  const ERR_JA={empty:"カードなし",crash:"ぶつかった",missing:"取りわすれ",order:"順番ちがい",not_goal:"ゴールに着かない",over_limit:"カード数オーバー",lr_swap:"右左のぎゃく"};
  function renderStats(){
    const a=getLog();
    if(!a.length){ $("stats").textContent="まだきろくがありません。"; return; }
    const ok=a.filter(r=>r.correct).length, cnt={};
    a.forEach(r=>r.errors&&r.errors.split("|").forEach(e=>cnt[e]=(cnt[e]||0)+1));
    const rows=Object.keys(cnt).map(k=>`<tr><td>${ERR_JA[k]||k}</td><td>${cnt[k]}回</td></tr>`).join("");
    $("stats").innerHTML=`回答 ${a.length}回 ／ 正解 ${ok}回 ／ ヒント合計 ${a.reduce((s,r)=>s+r.hints,0)}回`+
      (rows?`<table style="margin-top:6px"><tr><th>まちがいの種類</th><th>回数</th></tr>${rows}</table>`:"");
  }
  $("csv").onclick=()=>{
    const a=getLog(); if(!a.length) return alert("きろくがありません。");
    const head=["日時","レベル","ゆっくり","正解","誤答の種類","ヒント回数","所要秒","試行回数","カード数"];
    const lines=[head.join(",")].concat(a.map(r=>[r.at,r.level,r.slow,r.correct,
      (r.errors||"").split("|").filter(Boolean).map(e=>ERR_JA[e]||e).join("/"),r.hints,r.sec,r.tries,r.cards].join(",")));
    const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv"});
    const x=document.createElement("a"); x.href=URL.createObjectURL(blob); x.download="robot_michiannai_log.csv"; x.click();
  };
  $("clear").onclick=()=>{ try{ localStorage.removeItem(LOG_KEY); }catch(e){} renderStats(); };

  modeNote(); renderStats(); setLevel(1);
})();
</script>
</body>
