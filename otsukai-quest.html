<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おつかいクエスト</title>
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#3a2e22; --sub:#7a6a58; --line:#ecdcc4;
  --main:#f08a24; --main-d:#c96d10; --money:#d9480f; --time:#1c6fd1; --dur:#2b8a3e;
  --ok:#2b8a3e; --ng:#c92a2a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}
.lead{color:var(--sub);margin:0 0 12px;font-size:.9rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:2px solid var(--main);background:#fff;color:var(--main-d);border-radius:12px;padding:6px 14px}
button:hover{background:#fff1e0}
button.primary{background:var(--main);color:#fff;font-weight:bold;font-size:1.1rem;padding:10px 26px}
button.primary:hover{background:var(--main-d)}
button.on{background:var(--main);color:#fff}
button:disabled{opacity:.45;cursor:default}
.lv button{min-width:110px}
.story{font-size:1.15rem;line-height:2}
.story b.m{color:var(--money);background:#ffe8d9;border-radius:6px;padding:0 4px}
.story b.t{color:var(--time);background:#dcecff;border-radius:6px;padding:0 4px}
.story b.d{color:var(--dur);background:#dff5e3;border-radius:6px;padding:0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:3px solid var(--line);border-radius:14px;background:#fffdf8;text-align:center;padding:8px 2px;font-size:.95rem}
.item .e{font-size:2rem;display:block}
.item .p{font-weight:bold;color:var(--money)}
.item.sel{border-color:var(--main);background:#fff1e0}
.sum{margin-top:8px;font-weight:bold}
.sum.over{color:var(--ng)}
.clockbox{text-align:center}
svg{touch-action:none;max-width:100%;user-select:none;-webkit-user-select:none}
svg text,svg line{pointer-events:none}
.digital{font-size:1.4rem;font-weight:bold;color:var(--time)}
.hint{background:#f4f9ff;border-left:6px solid var(--time);padding:8px 12px;border-radius:8px;margin-top:8px}
.hint ol,.hint ul{margin:4px 0;padding-left:1.3em}
.result{border-radius:14px;padding:12px 16px;margin-top:10px}
.result.ok{background:#e6f7e9;border:2px solid var(--ok)}
.result.ng{background:#fdecec;border:2px solid var(--ng)}
.result li{margin:2px 0}
.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0;font-size:.8rem;color:#fff}
.bar span{display:flex;align-items:center;justify-content:center}
.small{font-size:.85rem;color:var(--sub)}
.hidden{display:none!important}
table{border-collapse:collapse;font-size:.9rem}
td,th{border:1px solid var(--line);padding:3px 10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 おつかいクエスト</h1>
  <p class="lead">問題文をよく読んで、予算と時刻の条件をどちらも守っておつかいに行こう！</p>

  <div class="card">
    <div class="row lv" id="levels">
      <button data-lv="1">レベル1<br><span class="small">予算だけ</span></button>
      <button data-lv="2">レベル2<br><span class="small">時刻だけ</span></button>
      <button data-lv="3">レベル3<br><span class="small">予算＋時刻</span></button>
      <label style="margin-left:auto"><input type="checkbox" id="slow"> ゆっくりモード</label>
    </div>
    <div class="small" id="modeNote"></div>
  </div>

  <div class="card">
    <div class="row">
      <strong id="qno">もんだい</strong>
      <button id="speak">🔊 よみあげ</button>
      <span class="small" id="timer" style="margin-left:auto"></span>
    </div>
    <div class="story" id="story"></div>
  </div>

  <div class="grid">
    <div class="card" id="shopBox">
      <strong>🍬 おやつをえらぼう</strong>
      <div class="items" id="items" style="margin-top:8px"></div>
      <div class="sum" id="sum"></div>
    </div>
    <div class="card clockbox" id="clockBox">
      <strong>🕒 家を出る時刻に合わせよう</strong>
      <svg id="clock" viewBox="0 0 300 300" width="280" height="280" aria-label="アナログ時計"></svg>
      <div class="digital" id="digital"></div>
      <div class="row" style="justify-content:center">
        <button data-d="-60">−1時間</button><button data-d="60">＋1時間</button>
        <button data-d="-5">−5分</button><button data-d="5">＋5分</button>
      </div>
      <div class="small">長い針をドラッグしても動かせるよ</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button class="primary" id="go">🚶 しゅっぱつ！</button>
      <button id="hintBtn">💡 ヒント（0/3）</button>
      <button id="next" class="hidden">▶ つぎのもんだい</button>
    </div>
    <div id="hintArea"></div>
    <div id="result"></div>
  </div>

  <div class="card">
    <div class="row">
      <strong>📊 きろく</strong>
      <button id="csv" style="margin-left:auto">📥 CSVで出力</button>
      <button id="clear">きろくを消す</button>
    </div>
    <div id="stats" class="small"></div>
  </div>
</div>

<script>
(() => {
  // ---------- データ ----------
  const POOL = [
    ["🍬","あめ",80],["🍫","チョコ",120],["🍪","クッキー",150],["🥤","ジュース",130],
    ["🍙","おにぎり",160],["🍡","だんご",100],["🍎","りんご",180],["🍦","アイス",200],
    ["🥨","プレッツェル",90],["🍩","ドーナツ",170],["🍌","バナナ",110],["🧁","カップケーキ",190]
  ];
  const LOG_KEY = "otsukai_quest_log";
  const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const pick = a => a[R(0,a.length-1)];
  const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };

  // 時刻は「12:00からの経過分(0〜719)」で保持
  const hOf = t => (Math.floor(t/60)%12) || 12;
  const mOf = t => t%60;
  const fmt = t => mOf(t) ? `${hOf(t)}時${mOf(t)}分` : `${hOf(t)}時`;
  const fmtD = t => `${hOf(t)}:${String(mOf(t)).padStart(2,"0")}`;
  const M = x => `<b class="m">${x}円</b>`;
  const T = x => `<b class="t">${x}</b>`;
  const D = x => `<b class="d">${x}分</b>`;

  // ---------- 状態 ----------
  const S = { level:3, slow:false, prob:null, sel:new Set(), clock:0, hints:0, tries:0, done:false, start:0, qCount:0 };
  window.__q = S; // 動作確認用

  // ---------- 問題生成 ----------
  function genProblem(level){
    const p = { level };
    if(level !== 2){
      p.n = 2;
      p.budget = pick([300,350,400,450,500]);
      for(let k=0;k<200;k++){
        const items = shuffle(POOL).slice(0,6);
        let ok = 0, c = 0;
        for(let i=0;i<6;i++) for(let j=i+1;j<6;j++){ c++; if(items[i][2]+items[j][2] <= p.budget) ok++; }
        if(ok>=2 && ok<=9){ p.items = items; break; }
      }
      if(!p.items) p.items = shuffle(POOL).slice(0,6);
    }
    if(level !== 1){
      p.meet = R(2,4)*60 + pick([0,15,30,45]);
      p.walk1 = pick([5,10,15]); p.shop = pick([10,15,20]); p.walk2 = pick([5,10,15]);
      p.total = p.walk1 + p.shop + p.walk2;
      p.dep = p.meet - p.total;
    }
    return p;
  }

  function storyHTML(p){
    const rt = `家から店まで${D(p.walk1)}、店で買い物に${D(p.shop)}、店から公園まで${D(p.walk2)}かかります。`;
    const arrive = `${T("午後"+fmt(p.meet))}ちょうどに公園に着くように`;
    if(p.level===1) return `あなたは${M(p.budget)}を持って、おやつを<b>${p.n}つ</b>買います。ねだんの合計が${M(p.budget)}<b>以内</b>になるように、おやつをえらびましょう。`;
    if(p.level===2) return `${T("午後"+fmt(p.meet))}に公園で友だちと遊ぶ約束をしました。おやつはもう決めてあります。${rt}${arrive}、家を出る時刻に時計を合わせましょう。`;
    return `${T("午後"+fmt(p.meet))}に公園で友だちと遊ぶ約束をしました。${M(p.budget)}以内で、おやつを<b>${p.n}つ</b>買います。${rt}${arrive}、家を出る時刻に時計を合わせて、おやつをえらびましょう。`;
  }

  // ---------- 画面 ----------
  const $ = id => document.getElementById(id);

  function newProblem(){
    S.prob = genProblem(S.level);
    S.sel.clear(); S.clock = 0; S.hints = 0; S.tries = 0; S.done = false; S.start = Date.now(); S.qCount++;
    $("qno").textContent = `もんだい ${S.qCount}`;
    $("story").innerHTML = storyHTML(S.prob);
    $("shopBox").classList.toggle("hidden", S.level===2);
    $("clockBox").classList.toggle("hidden", S.level===1);
    $("go").textContent = S.level===1 ? "✅ けってい" : S.level===2 ? "🚶 しゅっぱつ！" : "🚶 かいものして しゅっぱつ！";
    $("go").disabled = false; $("hintBtn").disabled = false;
    $("next").classList.add("hidden");
    $("hintArea").innerHTML = ""; $("result").innerHTML = "";
    $("hintBtn").textContent = "💡 ヒント（0/3）";
    renderItems(); renderClock(); updateSum();
  }

  function renderItems(){
    const box = $("items"); box.innerHTML = "";
    (S.prob.items||[]).forEach((it,i)=>{
      const b = document.createElement("button");
      b.className = "item" + (S.sel.has(i) ? " sel":"");
      b.innerHTML = `<span class="e">${it[0]}</span>${it[1]}<br><span class="p">${it[2]}円</span>`;
      b.onclick = () => { if(S.done) return; S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); renderItems(); updateSum(); };
      box.appendChild(b);
    });
  }
  const selSum = () => [...S.sel].reduce((s,i)=>s+S.prob.items[i][2],0);
  function updateSum(){
    const el = $("sum"); if(!S.prob.items){ el.textContent=""; return; }
    if(!S.slow){ el.className="sum"; el.textContent = `えらんだおやつ：${S.sel.size}つ`; return; }
    const s = selSum(), over = s > S.prob.budget;
    el.className = "sum" + (over ? " over":"");
    el.textContent = `えらんだおやつ：${S.sel.size}つ　合計 ${s}円 / 予算 ${S.prob.budget}円` + (over ? "（オーバー！）" : "");
  }

  // ---------- 時計 ----------
  const svg = $("clock"), NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent){ const e = document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||svg).appendChild(e); return e; }
  function buildClock(){
    svg.innerHTML = "";
    el("circle",{cx:150,cy:150,r:140,fill:"#fffdf8",stroke:"#3a2e22","stroke-width":5});
    for(let i=0;i<60;i++){
      const a = i*6*Math.PI/180, big = i%5===0, r1 = big?118:128;
      el("line",{x1:150+Math.sin(a)*r1,y1:150-Math.cos(a)*r1,x2:150+Math.sin(a)*134,y2:150-Math.cos(a)*134,stroke:"#3a2e22","stroke-width":big?3:1});
    }
    for(let n=1;n<=12;n++){
      const a = n*30*Math.PI/180;
      const t = el("text",{x:150+Math.sin(a)*98,y:150-Math.cos(a)*98+9,"text-anchor":"middle","font-size":26,"font-weight":"bold",fill:"#3a2e22"});
      t.textContent = n;
    }
    el("line",{id:"hh",x1:150,y1:150,x2:150,y2:90,stroke:"#d9480f","stroke-width":9,"stroke-linecap":"round"});
    el("line",{id:"mh",x1:150,y1:150,x2:150,y2:40,stroke:"#1c6fd1","stroke-width":6,"stroke-linecap":"round"});
    el("circle",{id:"grab",cx:150,cy:40,r:16,fill:"#1c6fd1","fill-opacity":.25,style:"cursor:grab"});
    el("circle",{cx:150,cy:150,r:8,fill:"#3a2e22"});
  }
  function renderClock(){
    const t = S.clock, ma = mOf(t)*6, ha = ((t%720)/720)*360;
    const set = (id,len,deg) => { const a = deg*Math.PI/180, e = $(id);
      e.setAttribute("x2",150+Math.sin(a)*len); e.setAttribute("y2",150-Math.cos(a)*len); return [150+Math.sin(a)*len,150-Math.cos(a)*len]; };
    set("hh",62,ha); const [gx,gy] = set("mh",110,ma);
    $("grab").setAttribute("cx",gx); $("grab").setAttribute("cy",gy);
    $("digital").textContent = `午後 ${fmtD(t)}`;
  }
  function moveClock(d){ if(S.done) return; S.clock = ((S.clock + d)%720 + 720)%720; renderClock(); }

  let dragging = false;
  function dragTo(ev){
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left)/r.width*300 - 150, y = (ev.clientY - r.top)/r.height*300 - 150;
    let deg = Math.atan2(x,-y)*180/Math.PI; if(deg<0) deg += 360;
    const nm = Math.round(deg/30)*5 % 60;          // 5分きざみ
    const pm = mOf(S.clock);
    let hour = Math.floor(S.clock/60);
    if(pm>=45 && nm<=15) hour += 1;                 // 59→0 をまたいだら1時間進む
    else if(pm<=15 && nm>=45) hour -= 1;
    S.clock = (((hour*60 + nm)%720)+720)%720;
    renderClock();
  }
  svg.addEventListener("pointerdown", ev => { if(S.done) return; ev.preventDefault(); dragging = true; svg.setPointerCapture(ev.pointerId); dragTo(ev); });
  svg.addEventListener("pointermove", ev => { if(dragging) dragTo(ev); });
  svg.addEventListener("pointerup", () => dragging = false);
  document.querySelectorAll("#clockBox button[data-d]").forEach(b => b.onclick = () => moveClock(+b.dataset.d));

  // ---------- ヒント ----------
  function showHints(){
    const p = S.prob, out = [];
    if(S.hints>=1){
      const li = [];
      if(p.items) li.push(`予算は${p.budget}円。おやつは${p.n}つ。`);
      if(p.dep!==undefined) li.push(`約束は午後${fmt(p.meet)}。かかる時間は ${p.walk1}分 ＋ ${p.shop}分 ＋ ${p.walk2}分。`);
      out.push(`<b>① 読み取ったこと</b><ul><li>${li.join("</li><li>")}</li></ul>`);
    }
    if(S.hints>=2){
      let s = "";
      if(p.items) s += `<li>ねだんの合計 ≦ ${p.budget}円</li>`;
      if(p.dep!==undefined){
        s += `<li>かかる時間の合計 ＝ ${p.walk1} ＋ ${p.shop} ＋ ${p.walk2} ＝ <b>${p.total}分</b></li><li>家を出る時刻 ＝ 午後${fmt(p.meet)} − ${p.total}分</li>`;
        const w = x => (x/p.total*100).toFixed(1)+"%";
        s += `</ul><div class="bar"><span style="width:${w(p.walk1)};background:#2b8a3e">歩く${p.walk1}</span><span style="width:${w(p.shop)};background:#f08a24">買い物${p.shop}</span><span style="width:${w(p.walk2)};background:#2b8a3e">歩く${p.walk2}</span></div><ul>`;
      }
      out.push(`<b>② 式にしてみよう</b><ul>${s}</ul>`);
    }
    if(S.hints>=3){
      let s = "";
      if(p.items){
        const top = Math.max(...p.items.map(i=>i[2]));
        s += `<li>いちばん高い${top}円のおやつを選ぶなら、もうひとつは<b>${p.budget-top}円以下</b>にしよう。</li>`;
      }
      if(p.dep!==undefined) s += `<li>家を出る時刻は <b>午後${hOf(p.dep)}時台</b> です。</li>`;
      out.push(`<b>③ 答えのはんい</b><ul>${s}</ul>`);
    }
    $("hintArea").innerHTML = out.length ? `<div class="hint">${out.join("<hr>")}</div>` : "";
    $("hintBtn").textContent = `💡 ヒント（${S.hints}/3）`;
    $("hintBtn").disabled = S.hints>=3;
  }
  $("hintBtn").onclick = () => { if(S.hints<3 && !S.done){ S.hints++; showHints(); } };

  // ---------- 判定 ----------
  function judge(){
    const p = S.prob, errs = [], msgs = [];
    if(p.items){
      if(S.sel.size !== p.n){ errs.push("count"); msgs.push(`おやつは${p.n}つえらぼう（いまは${S.sel.size}つ）。`); }
      else if(selSum() > p.budget){ errs.push("budget_over"); msgs.push(`合計${selSum()}円で、予算より<b>${selSum()-p.budget}円オーバー</b>です。`); }
    }
    if(p.dep!==undefined){
      const diff = (((S.clock - p.dep + 360)%720)+720)%720 - 360;
      if(diff>0){ errs.push("time_late"); msgs.push(`家を出る時刻が<b>${diff}分おそい</b>ので、約束に遅刻します。`); }
      else if(diff<0){ errs.push("time_early"); msgs.push(`家を出る時刻が<b>${-diff}分はやい</b>ので、公園で${-diff}分待つことになります。`); }
    }
    return { errs, msgs };
  }

  function record(correct, errs){
    const p = S.prob;
    const row = { at:new Date().toISOString(), level:p.level, slow:S.slow?1:0, correct:correct?1:0, errors:errs.join("|"),
                  hints:S.hints, sec:Math.round((Date.now()-S.start)/1000), tries:S.tries };
    try{ const a = JSON.parse(localStorage.getItem(LOG_KEY)||"[]"); a.push(row); localStorage.setItem(LOG_KEY, JSON.stringify(a)); }catch(e){}
    renderStats();
  }

  $("go").onclick = () => {
    if(S.done) return;
    S.tries++;
    const {errs, msgs} = judge(), p = S.prob, box = $("result");
    if(!errs.length){
      S.done = true; $("go").disabled = true; $("hintBtn").disabled = true; $("next").classList.remove("hidden");
      const parts = [];
      if(p.items) parts.push(`おやつ：${[...S.sel].map(i=>p.items[i][0]+p.items[i][1]).join("・")}（${selSum()}円）`);
      if(p.dep!==undefined) parts.push(`午後${fmt(p.dep)}に出発 → 午後${fmt(p.meet)}に公園にとうちゃく！`);
      box.innerHTML = `<div class="result ok"><b>🎉 だいせいかい！</b><ul><li>${parts.join("</li><li>")}</li></ul><span class="small">ヒント ${S.hints}回 ／ ${S.tries}回目で成功</span></div>`;
      record(true, []);
    } else {
      box.innerHTML = `<div class="result ng"><b>😢 おしい！ もう一度かんがえよう</b><ul><li>${msgs.join("</li><li>")}</li></ul></div>`;
      record(false, errs);
    }
  };
  $("next").onclick = newProblem;

  // ---------- 付属機能 ----------
  $("speak").onclick = () => {
    if(!("speechSynthesis" in window)) return alert("このブラウザは読み上げに対応していません。");
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance($("story").textContent); u.lang = "ja-JP"; u.rate = S.slow ? .8 : 1;
    speechSynthesis.speak(u);
  };
  setInterval(() => { $("timer").textContent = (S.slow || S.done) ? "" : `⏱ ${Math.round((Date.now()-S.start)/1000)}秒`; }, 1000);

  function setLevel(lv){
    S.level = lv; S.qCount = 0;
    document.querySelectorAll("#levels button").forEach(b => b.classList.toggle("on", +b.dataset.lv===lv));
    newProblem();
  }
  document.querySelectorAll("#levels button").forEach(b => b.onclick = () => setLevel(+b.dataset.lv));
  $("slow").onchange = e => { S.slow = e.target.checked; modeNote(); updateSum(); $("timer").textContent = ""; };
  function modeNote(){
    $("modeNote").textContent = S.slow
      ? "ゆっくりモード：時間表示なし・合計金額を自動で表示・読み上げが少しゆっくり"
      : "ふつうモード：経過時間を表示・合計金額は自分で計算";
  }

  // ---------- きろく ----------
  const getLog = () => { try{ return JSON.parse(localStorage.getItem(LOG_KEY)||"[]"); }catch(e){ return []; } };
  const ERR_JA = { count:"個数まちがい", budget_over:"予算オーバー", time_late:"出発がおそい", time_early:"出発がはやい" };
  function renderStats(){
    const a = getLog();
    if(!a.length){ $("stats").textContent = "まだきろくがありません。"; return; }
    const ok = a.filter(r=>r.correct).length, cnt = {};
    a.forEach(r => r.errors && r.errors.split("|").forEach(e => cnt[e] = (cnt[e]||0)+1));
    const rows = Object.keys(cnt).map(k=>`<tr><td>${ERR_JA[k]||k}</td><td>${cnt[k]}回</td></tr>`).join("");
    $("stats").innerHTML = `回答 ${a.length}回 ／ 正解 ${ok}回 ／ ヒント合計 ${a.reduce((s,r)=>s+r.hints,0)}回` +
      (rows ? `<table style="margin-top:6px"><tr><th>まちがいの種類</th><th>回数</th></tr>${rows}</table>` : "");
  }
  $("csv").onclick = () => {
    const a = getLog(); if(!a.length) return alert("きろくがありません。");
    const head = ["日時","レベル","ゆっくり","正解","誤答の種類","ヒント回数","所要秒","試行回数"];
    const lines = [head.join(",")].concat(a.map(r => [r.at,r.level,r.slow,r.correct,
      (r.errors||"").split("|").filter(Boolean).map(e=>ERR_JA[e]||e).join("/"),r.hints,r.sec,r.tries].join(",")));
    const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv"});
    const x = document.createElement("a"); x.href = URL.createObjectURL(blob); x.download = "otsukai_quest_log.csv"; x.click();
  };
  $("clear").onclick = () => { if(confirm("きろくを全部消しますか？")){ try{ localStorage.removeItem(LOG_KEY); }catch(e){} renderStats(); } };

  // ---------- 起動 ----------
  buildClock(); modeNote(); renderStats(); setLevel(3);
})();
</script>
</body>
</html>
